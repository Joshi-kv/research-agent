# src/ is the source root. The editable install below puts it on sys.path for
# every Python process in this venv, so `uv run src/tools/search.py`, uvicorn and
# pytest all resolve `from config.settings import ...` identically.
# Package discovery finds only config/, integrations/ and tools/ — tests live at
# the repo root, so they are never packaged.
#   run:    uvicorn main:app --app-dir src --reload
#   tests:  pytest

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "ddgs>=9.16.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langfuse>=4.15.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "readability-lxml>=0.9",
    "requests>=2.32",
    "rich>=13.0",
    "supabase>=2.31.0",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises live external services (Supabase, Groq); deselected by default",
]
addopts = "-m 'not integration'"
